[package]
name = "teleprompt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The prompter's speech recognizer. Opt-in: it downloads a native library
# when it builds, and the default build stays offline.
[features]
listen = ["teleprompt-listen/sherpa"]

[dependencies]
teleprompt-compile = { path = "../teleprompt-compile" }
teleprompt-derive = { path = "../teleprompt-derive" }
teleprompt-listen = { path = "../teleprompt-listen" }
# `setup`: the installed plugins, as a table.
tabled = { version = "0.20", default-features = false, features = ["std"] }
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-manifest = { path = "../teleprompt-manifest" }
teleprompt-plugin = { path = "../teleprompt-plugin" }
teleprompt-render = { path = "../teleprompt-render" }
teleprompt-desktop = { path = "../teleprompt-desktop" }
teleprompt-media = { path = "../teleprompt-media" }
teleprompt-playwright = { path = "../teleprompt-playwright" }
teleprompt-asciinema = { path = "../teleprompt-asciinema" }
teleprompt-remotion = { path = "../teleprompt-remotion" }
teleprompt-slidev = { path = "../teleprompt-slidev" }
teleprompt-vhs = { path = "../teleprompt-vhs" }
teleprompt-schedule = { path = "../teleprompt-schedule" }
teleprompt-translate = { path = "../teleprompt-translate" }
teleprompt-voice = { path = "../teleprompt-voice" }
teleprompt-voices = { path = "../teleprompt-voices" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# `sync` beyond the workspace entry's `rt-multi-thread`/`macros`: `dub` is
# the only command that fans out concurrently, and it is the only crate
# that needs `Semaphore`/`JoinSet` — widening the workspace entry would hand
# `sync` to every crate taking tokio as a dev-dependency for no reason.
# `time` is for `tokio::time::timeout` around `setup`'s voice probe: `setup`
# is the command reached for when something is broken, so it must not
# itself wait out a hanging server's full synthesis `timeout_ms`.
# `net` is for `serve`'s listener.
tokio = { workspace = true, features = ["sync", "time", "net"] }
# `serve`: the prompter's page, its API and the session's WebSocket, on
# loopback, over HTTP/1.1 only.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
# The stream a capture or build's progress is written to the page from.
futures-util = { version = "0.3", default-features = false }
# `lsp`: the language server's protocol.
lsp-server = "0.7"
lsp-types = "0.95"

[target.'cfg(unix)'.dependencies]
# SIGTERM stops a recording and still drafts it, for the app's Stop.
signal-hook = "0.3"

# `record`'s tests give it a terminal, as the recording tools need one.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9"

[dev-dependencies]
teleprompt-testkit = { path = "../teleprompt-testkit" }

[lints]
workspace = true
