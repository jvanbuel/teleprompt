[package]
name = "teleprompt-draft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `listen`: draft from what was said, with the speech models `setup`
# installs. Without it, `import` takes the words as a file.
[features]
listen = ["teleprompt-listen/sherpa", "teleprompt-setup/listen"]

[dependencies]
thiserror.workspace = true
teleprompt-project = { path = "../teleprompt-project" }
teleprompt-setup = { path = "../teleprompt-setup" }
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-script = { path = "../teleprompt-script" }
teleprompt-listen = { path = "../teleprompt-listen" }
teleprompt-scene = { path = "../teleprompt-scene" }
teleprompt-voice = { path = "../teleprompt-voice" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
teleprompt-testkit = { path = "../teleprompt-testkit" }

[lints]
workspace = true
