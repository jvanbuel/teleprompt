[package]
name = "teleprompt-setup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `listen`: this build can listen, so the uses that need a speech model are
# available; the models themselves are the author's to install.
[features]
listen = []

[dependencies]
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-scene = { path = "../teleprompt-scene" }
serde.workspace = true
serde_json.workspace = true
# The installed plugins and voices, as a table.
tabled = { version = "0.20", default-features = false, features = ["std"] }

[lints]
workspace = true
