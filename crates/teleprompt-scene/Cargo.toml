[package]
name = "teleprompt-scene"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
teleprompt-core = { path = "../teleprompt-core" }
thiserror.workspace = true
# Where teleprompt keeps per-user data: the XDG base directories, and
# Windows' known folders there.
etcetera = "0.10"

[target.'cfg(unix)'.dependencies]
# SIGTERM stops a recording and still drafts it, for the app's Stop.
signal-hook = "0.3"

[dev-dependencies]
teleprompt-testkit = { path = "../teleprompt-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
