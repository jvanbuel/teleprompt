[package]
name = "teleprompt-voices"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-voice = { path = "../teleprompt-voice" }
base64.workspace = true
# `multipart`: Voicebox takes a cloned voice's samples as a form upload.
reqwest = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
teleprompt-testkit = { path = "../teleprompt-testkit" }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
