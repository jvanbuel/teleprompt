[package]
name = "teleprompt-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
serde_yaml.workspace = true
teleprompt-core = { path = "../teleprompt-core" }
thiserror.workspace = true
# Serving a voice plugin runs its futures: a backend over HTTP needs a
# reactor.
tokio = { workspace = true, features = ["rt", "net", "time"] }

[dev-dependencies]
teleprompt-testkit = { path = "../teleprompt-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
