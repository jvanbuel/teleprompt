<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teleprompt prompt</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0d10; --ink: #eef2f6; --said: #5b6570; --now: #7ee0a8;
    --dim: #8a94a1; --bad: #ff8a80;
    --mono: ui-monospace, SFMono-Regular, "DejaVu Sans Mono", monospace;
    --size: 5.2vw;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body { font: 500 var(--size)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* For beam-splitter glass, which shows the screen reversed. */
  body.mirrored #script { transform: scaleX(-1); }
  #script { padding: 35vh 8vw 70vh; }
  /* With shots, the screen takes the right of the window, as the video's
     picture will, and the text the left. */
  body.with-screen { --size: 3.4vw; }
  body.with-screen #script { margin-right: 46vw; padding-right: 3vw; }
  #screen {
    display: none; position: fixed; top: 0; right: 0; bottom: 34px; width: 46vw;
    background: #000; align-items: center; justify-content: center;
  }
  body.with-screen #screen { display: flex; }
  body.with-screen.no-screen #screen { display: none; }
  body.with-screen.no-screen #script { margin-right: 0; }
  #screen video { max-width: 100%; max-height: 100%; }
  #slate { color: var(--dim); font: 15px/1.5 var(--mono); padding: 2em; text-align: center; }
  #slate:empty, #clip[hidden] { display: none; }
  .shot {
    font: 0.4em/1 var(--mono); color: var(--dim); border: 1px solid currentColor;
    border-radius: 4px; padding: 0.15em 0.4em; margin: 0 0.3em; vertical-align: middle;
    white-space: nowrap;
  }
  .shot.missing { border-style: dashed; }
  .shot.playing { color: var(--now); }
  .shot.played { opacity: 0.45; }
  .line { margin: 0 0 0.9em; cursor: pointer; border-left: 0.12em solid transparent; padding-left: 0.4em; margin-left: -0.52em; }
  /* A line with a current take. */
  .line.recorded { border-left-color: var(--now); }
  .w.said { color: var(--said); }
  .w.now { color: var(--now); text-decoration: underline; text-underline-offset: 0.18em; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px;
    background: #12161bee; color: var(--dim); font: 13px/1.5 var(--mono);
    display: flex; gap: 18px;
  }
  #status.bad { color: var(--bad); }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0b0d10e6; color: var(--ink); font: 500 22px system-ui, sans-serif;
    border: 0; cursor: pointer; width: 100%;
  }
</style>
</head>
<body>
<div id="script"></div>
<div id="screen"><video id="clip" muted playsinline></video><div id="slate"></div></div>
<button id="start">click to start a take</button>
<div id="bar">
  <span id="status">not listening</span>
  <span>click a line to take it from there · enter keep the take · space pause · m mirror · + − size · s screen</span>
</div>
<script>
"use strict";
const SEND_EVERY_MS = 100;   // how much audio each POST carries, at most
const $ = (id) => document.getElementById(id);

let words = [];              // per line, the word spans, split as the server splits
let shots = new Map();       // shot id to { clip, marker }
let queue = [];              // shots to play after the one playing
let listening = false;
let pending = [];            // samples not yet sent, at the microphone's rate
let rate = 0;                // the microphone's rate, once it is open
let inFlight = false;

function status(text, bad = false) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", bad);
}

async function loadScript() {
  const script = await (await fetch("/script.json")).json();
  const root = $("script");
  words = script.lines.map((text, l) => {
    const p = document.createElement("p");
    p.className = "line";
    p.addEventListener("click", () => take(l));
    const spans = text.split(/\s+/).filter(Boolean).map((w) => {
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = w;
      p.append(s, " ");
      return s;
    });
    root.append(p);
    return spans;
  });
  for (const shot of script.shots) markShot(shot);
  markRecorded(script.recorded);
  document.body.classList.toggle("with-screen", script.shots.length > 0);
  show({ line: 0, word: 0 });
}

function markRecorded(recorded) {
  [...$("script").children].forEach((p, l) => p.classList.toggle("recorded", !!recorded[l]));
}

/** A marker in the text where a shot starts: before the word that starts
 *  it, or after the line it follows. */
function markShot({ shot, at, clip }) {
  const marker = document.createElement("span");
  marker.className = "shot" + (clip ? "" : " missing");
  marker.textContent = "▶ " + shot + (clip ? "" : " (not captured)");
  shots.set(shot, { clip, marker });
  const lines = $("script").children;
  // A shot starts once word `at.word` is said; the marker goes after it.
  const said = at.word > 0 ? words[at.line]?.[at.word - 1] : null;
  if (said) said.after(" ", marker);
  else if (at.line > 0) lines[at.line - 1]?.append(marker);
  else lines[0]?.prepend(marker);
}

/** Plays `ids` in turn, cutting whatever is playing: the reader has moved
 *  on, and the screen follows the reader. */
function play(ids) {
  if (!ids || ids.length === 0) return;
  queue = [...ids];
  next();
}

function next() {
  const video = $("clip");
  for (const { marker } of shots.values()) {
    if (marker.classList.contains("playing")) {
      marker.classList.replace("playing", "played");
    }
  }
  const id = queue.shift();
  if (id === undefined) return;          // hold the last frame
  const { clip, marker } = shots.get(id);
  marker.classList.add("playing");
  if (clip) {
    $("slate").textContent = "";
    video.hidden = false;
    video.src = clip;
    video.play().catch(() => {});
  } else {
    video.hidden = true;
    $("slate").textContent = `${id} has not been captured: run teleprompt capture`;
    setTimeout(() => { if (marker.classList.contains("playing")) next(); }, 2000);
  }
}

let shownLine = -1;

/** Marks what has been said and the next word; moving to a new line brings
 *  it to a third of the way down, where the eye rests. */
function show(at) {
  words.forEach((spans, l) => spans.forEach((s, w) => {
    s.classList.toggle("said", l < at.line || (l === at.line && w < at.word));
    s.classList.toggle("now", l === at.line && w === at.word);
  }));
  if (at.line === shownLine) return;
  shownLine = at.line;
  const done = at.line >= words.length;
  if (done) status("end of script");
  const line = $("script").children[Math.min(at.line, words.length - 1)];
  if (!line) return;
  const top = done
    ? line.offsetTop + line.offsetHeight - window.innerHeight * 0.6
    : line.offsetTop - window.innerHeight * 0.3;
  window.scrollTo({ top, behavior: "smooth" });
}

async function send() {
  if (inFlight || pending.length === 0) return;
  inFlight = true;
  const chunk = Float32Array.from(pending);
  pending = [];
  try {
    const r = await fetch(`/listen?rate=${rate}`, { method: "POST", body: chunk.buffer });
    const heard = await r.json();
    show(heard);
    play(heard.play);
  } catch (e) {
    status(`lost the server: ${e}`, true);
  } finally {
    inFlight = false;
  }
}

const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.slice());
    return true;
  }
}
registerProcessor("tap", Tap);`;

let mic = null;               // opened once, on the first take

/** Opens the microphone and starts sending it. What it hears is the take,
 *  so the browser is asked not to clean it up. */
async function openMic() {
  if (mic) return;
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  const ctx = new AudioContext();
  rate = ctx.sampleRate;
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const tap = new AudioWorkletNode(ctx, "tap");
  tap.port.onmessage = (e) => {
    if (listening) for (const v of e.data) pending.push(v);
  };
  ctx.createMediaStreamSource(stream).connect(tap);
  setInterval(send, SEND_EVERY_MS);
  mic = stream;
}

/** A new take from line `from`; the server drops any take not kept. */
async function take(from = 0) {
  $("start")?.remove();
  try {
    await openMic();
  } catch (e) {
    status(`no microphone: ${e.message ?? e}`, true);
    return;
  }
  listening = false;
  pending = [];
  queue = [];
  for (const { marker } of shots.values()) marker.classList.remove("playing", "played");
  shownLine = -1;
  const top = await (await fetch(`/start?from=${from}`, { method: "POST" })).json();
  show(top);
  play(top.play);
  listening = true;
  status(`recording from line ${from + 1}`);
}

/** Ends the take, keeping the lines read in full. */
async function keep() {
  listening = false;
  await send();
  const { saved } = await (await fetch("/stop", { method: "POST" })).json();
  status(saved.length ? `kept ${saved.length} line(s): ${saved.join(", ")}` : "nothing read in full to keep");
  const script = await (await fetch("/script.json")).json();
  markRecorded(script.recorded);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    keep();
  } else if (e.key === " ") {
    e.preventDefault();
    listening = !listening;
    status(listening ? "listening" : "paused");
  } else if (e.key === "s") {
    document.body.classList.toggle("no-screen");
  } else if (e.key === "m") {
    document.body.classList.toggle("mirrored");
  } else if (e.key === "+" || e.key === "-") {
    const now = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"));
    const next = Math.max(2, now + (e.key === "+" ? 0.4 : -0.4));
    document.documentElement.style.setProperty("--size", `${next}vw`);
  }
});

$("start").addEventListener("click", () => take(0));
$("clip").addEventListener("ended", next);
$("clip").addEventListener("error", (e) => {
  e.target.hidden = true;
  $("slate").textContent = `this browser cannot play ${e.target.src.split("/").pop()}`;
});
loadScript();
</script>
</body>
</html>
