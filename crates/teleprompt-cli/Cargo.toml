[package]
name = "teleprompt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "teleprompt"
path = "src/main.rs"

# The prompter's speech recognizer, and drafting from what was said.
# Opt-in: it downloads a native library when it builds, and the default
# build stays offline.
[features]
listen = ["teleprompt-draft/listen", "teleprompt-serve/listen", "teleprompt-setup/listen"]

[dependencies]
teleprompt-project = { path = "../teleprompt-project" }
teleprompt-scene = { path = "../teleprompt-scene" }
teleprompt-scenes = { path = "../teleprompt-scenes" }
teleprompt-voices = { path = "../teleprompt-voices" }
teleprompt-setup = { path = "../teleprompt-setup" }
teleprompt-lsp = { path = "../teleprompt-lsp" }
teleprompt-draft = { path = "../teleprompt-draft" }
teleprompt-serve = { path = "../teleprompt-serve" }
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-pipeline = { path = "../teleprompt-pipeline" }
teleprompt-script = { path = "../teleprompt-script" }
teleprompt-voice = { path = "../teleprompt-voice" }
clap.workspace = true
inquire = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# `record`'s tests give it a terminal, as the recording tools need one.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9"

[dev-dependencies]
# The Gemini stub answers audio as base64, as the API does.
base64.workspace = true
# A client for `serve`'s session socket.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
teleprompt-testkit = { path = "../teleprompt-testkit" }
# The tests look at what the engine made with the crates it made it with.
teleprompt-listen = { path = "../teleprompt-listen" }
teleprompt-manifest = { path = "../teleprompt-manifest" }
serde_yaml.workspace = true
insta.workspace = true
tempfile.workspace = true
# `net` and `io-util` beyond the binary's own `rt-multi-thread`/`macros`:
# `tests/dub.rs` runs an in-process HTTP stub for the kokoro voice-list
# check, the same way `teleprompt-voices`' own tests do. `time` is
# for `tokio::time::sleep`, which the same stub uses to hold a synthesis
# response open long enough for concurrent callers to actually overlap.
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[lints]
workspace = true
