[package]
name = "teleprompt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "teleprompt_cli"
path = "src/lib.rs"

[[bin]]
name = "teleprompt"
path = "src/main.rs"

# `teleprompt prompt`'s speech recognizer. Opt-in: it downloads a native
# library when it builds, and the default build stays offline.
[features]
listen = ["dep:teleprompt-listen-sherpa", "teleprompt-listen-sherpa/sherpa"]

[dependencies]
teleprompt-cache = { path = "../teleprompt-cache" }
teleprompt-capture = { path = "../teleprompt-capture" }
teleprompt-compile = { path = "../teleprompt-compile" }
teleprompt-derive = { path = "../teleprompt-derive" }
teleprompt-listen = { path = "../teleprompt-listen" }
inquire = "0.9"
teleprompt-listen-sherpa = { path = "../teleprompt-listen-sherpa", optional = true }
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-manifest = { path = "../teleprompt-manifest" }
teleprompt-prompter = { path = "../teleprompt-prompter" }
teleprompt-scene = { path = "../teleprompt-scene" }
teleprompt-render = { path = "../teleprompt-render" }
teleprompt-macos = { path = "../teleprompt-macos" }
teleprompt-media = { path = "../teleprompt-media" }
teleprompt-playwright = { path = "../teleprompt-playwright" }
teleprompt-asciinema = { path = "../teleprompt-asciinema" }
teleprompt-remotion = { path = "../teleprompt-remotion" }
teleprompt-slidev = { path = "../teleprompt-slidev" }
teleprompt-vhs = { path = "../teleprompt-vhs" }
teleprompt-x11 = { path = "../teleprompt-x11" }
teleprompt-schedule = { path = "../teleprompt-schedule" }
teleprompt-translate = { path = "../teleprompt-translate" }
teleprompt-voice = { path = "../teleprompt-voice" }
teleprompt-voice-kokoro = { path = "../teleprompt-voice-kokoro" }
teleprompt-voice-voicebox = { path = "../teleprompt-voice-voicebox" }
teleprompt-voice-gemini = { path = "../teleprompt-voice-gemini" }
teleprompt-voice-null = { path = "../teleprompt-voice-null" }
teleprompt-lsp = { path = "../teleprompt-lsp" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# `sync` beyond the workspace entry's `rt-multi-thread`/`macros`: `dub` is
# the only command that fans out concurrently, and it is the only crate
# that needs `Semaphore`/`JoinSet` — widening the workspace entry would hand
# `sync` to every crate taking tokio as a dev-dependency for no reason.
# `time` is for `tokio::time::timeout` around `doctor`'s probe: `doctor` is
# the command reached for when something is broken, so it must not itself
# wait out a hanging server's full synthesis `timeout_ms`.
tokio = { workspace = true, features = ["sync", "time"] }
# `prompt`'s session socket. Blocking, like the rest of its server; only
# the handshake, no TLS or URL client.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM stops a recording and still drafts it, for the app's Stop.
signal-hook = "0.3"

# `record`'s tests give it a terminal, as the recording tools need one.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9"

[dev-dependencies]
# The Gemini stub answers audio as base64, as the API does.
base64.workspace = true
# A client for `prompt`'s session socket.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
teleprompt-testkit = { path = "../teleprompt-testkit" }
insta.workspace = true
tempfile.workspace = true
# `net` and `io-util` beyond the binary's own `rt-multi-thread`/`macros`:
# `tests/dub.rs` runs an in-process HTTP stub for the kokoro voice-list
# check, the same way `teleprompt-voice-kokoro`'s own tests do. `time` is
# for `tokio::time::sleep`, which the same stub uses to hold a synthesis
# response open long enough for concurrent callers to actually overlap.
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[lints]
workspace = true
