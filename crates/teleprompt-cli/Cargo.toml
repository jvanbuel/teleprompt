[package]
name = "teleprompt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "teleprompt_cli"
path = "src/lib.rs"

[[bin]]
name = "teleprompt"
path = "src/main.rs"

[dependencies]
teleprompt-cache = { path = "../teleprompt-cache" }
teleprompt-compile = { path = "../teleprompt-compile" }
teleprompt-core = { path = "../teleprompt-core" }
teleprompt-scene = { path = "../teleprompt-scene" }
teleprompt-schedule = { path = "../teleprompt-schedule" }
teleprompt-voice = { path = "../teleprompt-voice" }
teleprompt-voice-null = { path = "../teleprompt-voice-null" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
