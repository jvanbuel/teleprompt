# A narrated video for plugin authors, made with the plugins it explains:
# its cards are drawn by the card adapter in examples/plugins, and one of
# its lines is spoken by the eSpeak voice there. The narrator is no plugin
# at all: `studio` is a speech server that speaks OpenAI's API, named here.
# The terminal session was recorded once, with asciinema.
#
# Run from the repository root, with the example plugins on PATH, agg
# (https://github.com/asciinema/agg) and espeak-ng installed, and
# Kokoro-FastAPI (or any server of the API) listening on base_url:
#
#   PATH="$PWD/examples/plugins:$PATH" \
#     cargo run -- build examples/plugin-authors/scripts/plugins.md
#
# `check` and `plan` need the plugins on PATH, and nothing else.
[locales]
source = "en"
targets = []

[voice]
backend = "studio"
voice = "af_heart"
speed = 1.0

[voice.pronounce]
JSON = "jason"
eSpeak = "ee speak"

[backends.studio]
api = "openai"
base_url = "http://localhost:8880/v1"
model = "kokoro"

[backends.espeak]
wpm = 165

# The one line the eSpeak plugin says.
[voices.espeak]
backend = "espeak"
voice = "en-us"

[scene.asciinema]
theme = "dracula"
font_size = 32
