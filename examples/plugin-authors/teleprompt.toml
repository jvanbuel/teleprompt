# A narrated video for plugin authors, made with what it explains: its
# cards are drawn by the card scene plugin in examples/plugins, and one of
# its lines is spoken by the eSpeak speech server in examples/voices. The
# narrator, `studio`, is another speech server: voices are servers that
# speak OpenAI's API, named here, never plugins. The terminal session was
# recorded once, with asciinema.
#
# Run from the repository root, with the example plugin on PATH, agg
# (https://github.com/asciinema/agg) and espeak-ng installed, the eSpeak
# server running, and Kokoro-FastAPI (or any server of the API) listening
# on studio's base_url:
#
#   python3 examples/voices/espeak_server.py 8891 --wpm 165 &
#   PATH="$PWD/examples/plugins:$PATH" \
#     cargo run -- build examples/plugin-authors/scripts/plugins.md
#
# `check` and `plan` need the plugin on PATH, and nothing else.
[locales]
source = "en"
targets = []

[voice]
backend = "studio"
voice = "af_heart"
speed = 1.0

[voice.pronounce]
JSON = "jason"
eSpeak = "ee speak"

[backends.studio]
base_url = "http://localhost:8880/v1"
model = "kokoro"

[backends.espeak]
base_url = "http://localhost:8891/v1"
model = "espeak"

# The one line the eSpeak server says.
[voices.espeak]
backend = "espeak"
voice = "en-us"

[scene.asciinema]
theme = "dracula"
font_size = 32
