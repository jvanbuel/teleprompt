# A narrated video made from an ordinary Slidev deck, spoken by Kokoro.
#
# Run from the repository root. The script is drafted from the deck's
# speaker notes, and names the deck in its own front matter:
#
#   (cd examples/slidev/deck && npm install)
#   cargo run -- from examples/slidev/deck/slides.md --slidev \
#       --out examples/slidev/scripts/slides.md
#   cargo run -- build examples/slidev/scripts/slides.md
#
# Kokoro-FastAPI has to be listening on base_url for `dub` and `build`;
# `check`, `plan` and `diff` need neither it nor Node.
[locales]
source = "en"
targets = []

[voice]
source = "synthetic"
backend = "kokoro"
voice = "af_heart"
speed = 1.0

[voice.pronounce]
Slidev = "slide dev"

[backends.kokoro]
base_url = "http://localhost:8880"
timeout_ms = 60000
concurrency = 2
