# A narrated video whose every picture is drawn by Remotion, spoken by
# Kokoro.
#
# Run from the repository root:
#
#   (cd examples/remotion/motion && npm install)
#   cargo run -- build examples/remotion/scripts/remotion.md
#
# Kokoro-FastAPI has to be listening on base_url for `dub` and `build`;
# `check`, `plan` and `diff` need neither it nor Node.
[locales]
source = "en"
targets = []

[voice]
backend = "kokoro"
voice = "af_heart"
speed = 1.0

[backends.kokoro]
base_url = "http://localhost:8880"
timeout_ms = 60000
concurrency = 2

# `project` is an ordinary Remotion project, relative to this one; `entry`
# (default `src/index.ts`) is relative to it.
[scene.remotion]
project = "motion"
