# What the binaries link may only be permissively licensed, so teleprompt
# stays MIT and anyone can ship it. Tools teleprompt runs (vhs, ffmpeg,
# asciinema, Remotion…) are not linked, and not checked here: they are
# installed by the user and never shipped (docs/design.md#what-teleprompt-ships).
#
#   cargo deny --all-features check licenses
#   cargo deny --manifest-path apps/linux/Cargo.toml check licenses

[graph]
# Only what a build links, not tests' tools.
exclude-dev = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Mozilla's root certificates, as webpki-roots carries them.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Known vulnerabilities fail the build; `cargo update -p <crate>` is the
# usual fix.
#
#   cargo deny --all-features check advisories
[advisories]
ignore = [
    # zip 2.4.2, extracting a ZIP: SUID/SGID bits kept (0367), symlinks
    # out of the destination (0368) and permissions set through them
    # (0369); fixed in zip 9. Only sherpa-onnx-sys's build script uses it,
    # behind the opt-in `sherpa` feature, to unpack sherpa-onnx's own
    # release archive for Apple targets; nothing shipped links it. 1.13.8, the latest release, pins zip 2; upstream master is
    # on zip 9. Remove all three once sherpa-onnx publishes that.
    { id = "RUSTSEC-2026-0367", reason = "zip: build-time only, sherpa-onnx-sys pins zip 2" },
    { id = "RUSTSEC-2026-0368", reason = "zip: build-time only, sherpa-onnx-sys pins zip 2" },
    { id = "RUSTSEC-2026-0369", reason = "zip: build-time only, sherpa-onnx-sys pins zip 2" },
]
