[package]
name = "teleprompt-gtk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "teleprompt's prompter page in a GTK 4 and libadwaita window"
publish = false

# Not a member of the repository's workspace: it needs GTK and WebKit
# to build, and the crates must not.
[workspace]

[[bin]]
name = "teleprompt-gtk"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
resvg = { version = "0.48", default-features = false }
# The prompter is the page `teleprompt serve` serves, shown in WebKit.
webkit = { version = "0.4", package = "webkit6", features = ["v2_42"] }
async-channel = "2"
# Session mode's terminal: `teleprompt record` runs in it.
vte4 = "0.8"
# The server stops with the app: prctl(PR_SET_PDEATHSIG).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
too_many_lines = "warn"
# Each `unsafe` says why it is sound, as the workspace forbids it outright.
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3"
