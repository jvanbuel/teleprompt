[package]
name = "teleprompt-gtk"
version = "0.1.0"
edition = "2021"
# as_chunks.
rust-version = "1.88"
license = "MIT"
description = "A native Linux prompter for teleprompt: GTK 4 and libadwaita"
publish = false

# Not a member of the repository's workspace: it needs GTK and GStreamer
# to build, and the crates must not.
[workspace]

[[bin]]
name = "teleprompt-gtk"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gst = { version = "0.23", package = "gstreamer" }
gst-app = { version = "0.23", package = "gstreamer-app" }
async-channel = "2"
pangocairo = "0.20"
# Session mode's terminal: `teleprompt record` runs in it.
vte4 = "0.8"
# The server stops with the app: prctl(PR_SET_PDEATHSIG).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session socket, as the server speaks it.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
# The script and clips; plain HTTP on loopback, so no TLS.
ureq = { version = "2", default-features = false }

[lints.clippy]
too_many_lines = "warn"
