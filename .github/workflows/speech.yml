name: Speech

# The recognizer, run with a real model: following a reader, and
# transcribing a recording into timed words for `import`.
on:
  push:
    branches: [main]
    paths:
      - crates/teleprompt-listen/**
      - crates/teleprompt-listen-sherpa/**
      - crates/teleprompt-derive/**
      - crates/teleprompt-cli/src/cmd/import*
      - crates/teleprompt-cli/src/cmd/record*
      - crates/teleprompt-cli/tests/import*
      - crates/teleprompt-cli/tests/record*
      - .github/workflows/speech.yml
  pull_request:
    paths:
      - crates/teleprompt-listen/**
      - crates/teleprompt-listen-sherpa/**
      - crates/teleprompt-derive/**
      - crates/teleprompt-cli/src/cmd/import*
      - crates/teleprompt-cli/src/cmd/record*
      - crates/teleprompt-cli/tests/import*
      - crates/teleprompt-cli/tests/record*
      - .github/workflows/speech.yml

# A newer push supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speech:
    # macOS too: `record`'s terminal and ffmpeg run there as well, with a
    # file standing in for the microphone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # A recording that never ends fails the job, rather than holding a
    # runner for hours.
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MODEL: sherpa-onnx-streaming-zipformer-en-2023-06-26
      PUNCT: sherpa-onnx-online-punct-en-2024-08-06
      TELEPROMPT_REQUIRE_LISTEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg, which `record` records the microphone with, and asciinema the shell
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg asciinema
      - name: ffmpeg, which `record` records the microphone with, and asciinema the shell
        if: runner.os == 'macOS'
        run: brew install ffmpeg asciinema
      - uses: actions/cache@v6
        with:
          path: model
          key: ${{ env.MODEL }}-${{ env.PUNCT }}
      - name: Speech model
        run: |
          if [ ! -d "model/$MODEL" ]; then
            mkdir -p model
            curl -sSfL "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$MODEL.tar.bz2" | tar xj -C model
          fi
          if [ ! -d "model/$PUNCT" ]; then
            curl -sSfL "https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/$PUNCT.tar.bz2" | tar xj -C model
          fi
      # sherpa-onnx-sys unpacks its native library into
      # target/sherpa-onnx-prebuilt, and trusts that directory if it
      # exists. The Rust cache restores it without the library in it, so
      # remove it and rerun the build script to download it again.
      - run: rm -rf target/sherpa-onnx-prebuilt && cargo clean -p sherpa-onnx-sys
      - name: Recognizer tests, with the model
        env:
          TELEPROMPT_LISTEN_MODEL: ${{ github.workspace }}/model/${{ env.MODEL }}
          TELEPROMPT_PUNCT_MODEL: ${{ github.workspace }}/model/${{ env.PUNCT }}
        run: |
          cargo clippy -p teleprompt-listen-sherpa --features sherpa --all-targets -- -D warnings
          cargo clippy -p teleprompt-cli --features listen --all-targets -- -D warnings
          cargo test -p teleprompt-listen-sherpa --features sherpa
          cargo test -p teleprompt-cli --features listen --test import_listen --test record_listen --test record
