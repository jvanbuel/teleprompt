name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `build` renders with ffmpeg as a subprocess. The render tests skip
      # themselves where there is none, so CI installs one and sets
      # TELEPROMPT_REQUIRE_FFMPEG — which turns a skip into a failure, so a
      # workflow that stops installing it cannot go quietly green.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # `capture` draws a terminal recording with `agg`, asciinema's
      # renderer. A released binary rather than `cargo install agg`: the
      # `agg` on crates.io is an unrelated library and installing it fails
      # with "no binaries", which is how this workflow first went red.
      # Pinned rather than `latest` so a release upstream cannot change what
      # the frames look like without a commit here saying so.
      # TELEPROMPT_REQUIRE_CAPTURE turns the capture tests' skip into a
      # failure for the same reason TELEPROMPT_REQUIRE_FFMPEG does: a stage
      # nothing exercises is a stage that rots.
      - name: Install agg
        run: |
          curl -fsSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg
          agg --version
      # `vhs` is the renderer teleprompt prefers for terminal scenes: it
      # already knows how to draw a tape, and teleprompt's job is only to
      # write one that lasts as long as the narration over it.
      #
      # Charm's own action rather than a hand-rolled install. The first
      # attempt here used apt's ttyd and nothing else, and got a `vhs` that
      # exits 0, prints its usual "Creating …" and its usual closing
      # advert, and leaves an empty file — which is what zero captured
      # frames looks like from outside. The action installs ttyd from its
      # own releases, installs fonts, unsets CI (Charm's termenv drops ANSI
      # when it is set, and a terminal recording with no colour in it is
      # not the one the author wrote) and asks for true colour.
      #
      # TELEPROMPT_REQUIRE_VHS turns the capture tests' skip into a
      # failure, so the renderer teleprompt prefers cannot quietly stop
      # being exercised.
      - uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: true
      # …with ttyd pinned back.
      #
      # `vhs` screenshots the CSS selectors `canvas.xterm-text-layer` and
      # `canvas.xterm-cursor-layer`, which are xterm.js 4's canvas
      # renderer. ttyd 1.7.7 ships xterm.js 5, whose default renderer draws
      # into different elements — so the selectors match nothing, every
      # screenshot is empty, and `vhs` finishes a recording of no frames
      # without noticing. The action installs ttyd `latest`, so it walks
      # into this too.
      #
      # 1.7.4 is what `vhs` v0.12 was built against, and what the sandbox
      # this was developed in happens to have.
      - name: Pin ttyd to what vhs 0.12 can screenshot
        run: |
          curl -fsSL -o /tmp/ttyd \
            https://github.com/tsl0922/ttyd/releases/download/1.7.4/ttyd.x86_64
          chmod +x /tmp/ttyd
          sudo mv /tmp/ttyd "$(command -v ttyd)"
          ttyd --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TELEPROMPT_REQUIRE_FFMPEG: "1"
          TELEPROMPT_REQUIRE_CAPTURE: "1"

      # Last on purpose, and never fatal: `vhs` exits 0 and writes nothing
      # here, and the only way to read why from outside is the end of the
      # log — this sandbox cannot fetch the blob store a step's own output
      # lives in.
      #
      # Two hypotheses are already dead. Not the encoder: a gif, which
      # never touches ffmpeg, fails identically. Not ttyd's version: 1.7.4,
      # which vhs v0.12 was built against, fails identically to 1.7.7.
      #
      # What is left is the page. `vhs` looks up `canvas.xterm-text-layer`
      # and *discards the error* (vhs.go:334), so a page that does not have
      # that element — because ttyd did not serve it, or because the
      # renderer it chose does not draw into it — records zero frames and
      # reports success. This asks the page directly.
      - name: Why does vhs write nothing?
        if: always()
        continue-on-error: true
        run: |
          set +e -x
          vhs --version; ttyd --version; google-chrome --version
          ttyd -p 7681 -t rendererType=canvas -t disableResizeOverlay=true bash &
          sleep 3
          curl -s --max-time 5 http://localhost:7681 | head -c 400; echo
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=4000 --dump-dom http://localhost:7681 > /tmp/dom.html
          echo "dom bytes: $(wc -c < /tmp/dom.html)"
          grep -o 'canvas[^>]*class="[^"]*"' /tmp/dom.html | head -5 || echo "NO CANVAS IN DOM"
          grep -c "xterm-text-layer" /tmp/dom.html || echo "xterm-text-layer: 0"
          kill %1 2>/dev/null
          cd /tmp
          printf 'Output "/tmp/a.gif"\nSet Width 600\nSet Height 400\nType "echo hi"\nEnter\nSleep 500ms\n' > a.tape
          vhs a.tape; ls -la /tmp/a.gif || echo "NO GIF"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
