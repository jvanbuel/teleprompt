name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Full debug info made the workspace's test build 5.6 GB, and with
    # clippy's output, vhs's browser and the cache beside it the runner ran
    # out of disk mid-recording: vhs stopped at 69.8s of a longer tape and
    # every shot after it became a slate. Line tables keep file:line in a
    # panic's backtrace at 2.0 GB; incremental state is never reused here.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      # Even so, the workspace outgrew the runner's free disk: dub wrote
      # no cache entry ("No space left on device"). What the runner ships
      # for other languages is ~25 GB this job never uses.
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `build` renders with ffmpeg as a subprocess. The render tests skip
      # themselves where there is none, so CI installs one and sets
      # TELEPROMPT_REQUIRE_FFMPEG — which turns a skip into a failure, so a
      # workflow that stops installing it cannot go quietly green. eSpeak NG
      # is what the example speech server speaks with.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      # Pinned to v0.11.0. v0.12.0 is the latest release and cannot record
      # here at all: it runs every tape command, prints "Creating …",
      # prints the publish hint, exits 0 and writes no file — including
      # from its own `vhs new` example. That is upstream issue #787,
      # opened the day after v0.12.0 shipped and still open, which reports
      # exactly this on ubuntu-24.04 runners and names v0.11.0 as the
      # version that records the same tape.
      #
      # Found by reading the issue tracker, after eliminating ttyd's
      # version, the page, the encoder and the tape by experiment. The
      # issue tracker should have come first.
      - uses: charmbracelet/vhs-action@v2
        with:
          version: v0.11.0
          install-fonts: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TELEPROMPT_REQUIRE_FFMPEG: "1"
          # A stage nothing exercises is a stage that rots: these turn the
          # capture tests' skips into failures, so a runner that stops
          # being able to record cannot go quietly green.
          TELEPROMPT_REQUIRE_CAPTURE: "1"
          TELEPROMPT_REQUIRE_VHS: "1"


  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      # The crate layering in docs/design.md#crates, checked rather than
      # trusted: a new edge between workspace crates must be argued for there.
      - run: python3 tools/check_deps.py
      # The Python examples are written to be read and copied: linted,
      # formatted, and the stdlib-only ones typed strictly.
      - name: Python examples
        working-directory: examples
        run: |
          files="plugins/teleprompt-scene-card voices/espeak_server.py moo/deck/snippets/moo_server.py"
          ruff="pipx run --spec ruff==0.15.8 ruff"
          $ruff check --config ruff.toml $files
          $ruff format --check --config ruff.toml $files
          for f in plugins/teleprompt-scene-card voices/espeak_server.py; do pipx run --spec mypy==1.19.1 mypy --strict "$f"; done

  # What the binaries link is permissively licensed (deny.toml), so
  # teleprompt stays MIT to ship, and has no known vulnerability: the CLI
  # with every feature, and the Linux app, which is a workspace of its own.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/linux/Cargo.toml
          command: check advisories licenses
