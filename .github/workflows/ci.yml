name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `build` renders with ffmpeg as a subprocess. The render tests skip
      # themselves where there is none, so CI installs one and sets
      # TELEPROMPT_REQUIRE_FFMPEG — which turns a skip into a failure, so a
      # workflow that stops installing it cannot go quietly green.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # `capture` draws a terminal recording with `agg`, asciinema's
      # renderer. A released binary rather than `cargo install agg`: the
      # `agg` on crates.io is an unrelated library and installing it fails
      # with "no binaries", which is how this workflow first went red.
      # Pinned rather than `latest` so a release upstream cannot change what
      # the frames look like without a commit here saying so.
      # TELEPROMPT_REQUIRE_CAPTURE turns the capture tests' skip into a
      # failure for the same reason TELEPROMPT_REQUIRE_FFMPEG does: a stage
      # nothing exercises is a stage that rots.
      - name: Install agg
        run: |
          curl -fsSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg
          agg --version
      # `vhs` is the renderer teleprompt prefers for terminal scenes: it
      # already knows how to draw a tape, and teleprompt's job is only to
      # write one that lasts as long as the narration over it.
      #
      # Installed with Charm's own action, and deliberately not required:
      # on this runner `vhs` v0.12 cannot record at all. Established by
      # elimination rather than assumed —
      #
      #   ttyd 1.7.4 (what vhs was built against) fails as 1.7.7 does;
      #   ttyd serves `canvas.xterm-text-layer` and Chrome renders it,
      #     confirmed by dumping the DOM, so the element vhs looks for
      #     is there;
      #   `Screenshot`, which writes a PNG straight from that canvas and
      #     never invokes ffmpeg, writes nothing either.
      #
      # So it is not the encoder, not ttyd, not the page: `vhs` cannot
      # photograph a canvas that demonstrably exists, and it does not
      # check — `vhs.go:334` discards the element lookup's error — so it
      # finishes a recording of no frames and exits 0.
      #
      # It stays installed because that is the configuration teleprompt has
      # to survive: preferred backend present, tried, and failing. The
      # capture tests cover the fallback that results.
      - uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TELEPROMPT_REQUIRE_FFMPEG: "1"
          TELEPROMPT_REQUIRE_CAPTURE: "1"

      # Before concluding anything about upstream: run the tape Charm
      # themselves generate, with vhs's own defaults, at its own size.
      # If `vhs new`'s example records, the fault is in the tape
      # teleprompt writes — a frame size below what its padding needs, a
      # setting in the wrong place — and that is ours to fix. If it does
      # not, a 13-day-old release cannot record its own example here.
      - name: Does vhs record its own example?
        if: always()
        continue-on-error: true
        run: |
          set +e -x
          cd /tmp && rm -rf own && mkdir own && cd own
          vhs new demo.tape
          cat demo.tape
          vhs demo.tape 2>&1 | tail -5
          ls -la /tmp/own/
          # And the minimum: no Set at all, so every default is vhs's.
          printf 'Output "/tmp/own/bare.gif"\nType "echo hi"\nEnter\nSleep 1s\n' > bare.tape
          vhs bare.tape 2>&1 | tail -3
          ls -la /tmp/own/bare.gif || echo "NO BARE GIF"
          # An annotation as well as the log: a step's own output lives in
          # a blob store this project's sandbox cannot fetch, and reading
          # it has cost two rounds already.
          for f in /tmp/own/demo.gif /tmp/own/bare.gif; do
            if [ -s "$f" ]; then
              echo "::notice title=vhs::RECORDED $f ($(wc -c < "$f") bytes)"
            else
              echo "::notice title=vhs::NOTHING at $f"
            fi
          done



  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
