name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `build` renders with ffmpeg as a subprocess. The render tests skip
      # themselves where there is none, so CI installs one and sets
      # TELEPROMPT_REQUIRE_FFMPEG — which turns a skip into a failure, so a
      # workflow that stops installing it cannot go quietly green.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # `capture` draws a terminal recording with `agg`, asciinema's
      # renderer. A released binary rather than `cargo install agg`: the
      # `agg` on crates.io is an unrelated library and installing it fails
      # with "no binaries", which is how this workflow first went red.
      # Pinned rather than `latest` so a release upstream cannot change what
      # the frames look like without a commit here saying so.
      # TELEPROMPT_REQUIRE_CAPTURE turns the capture tests' skip into a
      # failure for the same reason TELEPROMPT_REQUIRE_FFMPEG does: a stage
      # nothing exercises is a stage that rots.
      - name: Install agg
        run: |
          curl -fsSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg
          agg --version
      # `vhs` is the renderer teleprompt prefers for terminal scenes: it
      # already knows how to draw a tape, and teleprompt's job is only to
      # write one that lasts as long as the narration over it.
      #
      # Set up the way `charmbracelet/vhs-action` does it, because the
      # first attempt — apt's ttyd, apt's ffmpeg, nothing else — got a
      # `vhs` that exits 0, prints its usual "Creating …" and its usual
      # closing advert, and leaves an empty file. That is what zero
      # captured frames looks like from the outside. The action installs
      # ttyd from its own releases, installs fonts, unsets CI (Charm's
      # termenv drops ANSI when it is set) and asks for true colour.
      - run: sudo apt-get install -y --no-install-recommends fonts-jetbrains-mono
      - name: Install ttyd
        run: |
          curl -fsSL -o /tmp/ttyd \
            https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /tmp/ttyd
          sudo mv /tmp/ttyd /usr/local/bin/ttyd
          ttyd --version
      - run: go install github.com/charmbracelet/vhs@latest
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # What this machine actually has, and what `vhs` actually does with
      # a three-line tape. Never fails the build: it is here to be read.
      - name: Can vhs record here?
        run: |
          echo "ttyd:    $(ttyd --version 2>&1 | head -1)"
          echo "chrome:  $(command -v google-chrome chromium chromium-browser | head -1)"
          echo "ffmpeg:  $(ffmpeg -version 2>&1 | head -1)"
          printf 'Output "/tmp/probe.gif"\nSet Width 600\nSet Height 400\nType "echo hi"\nEnter\nSleep 500ms\n' > /tmp/probe.tape
          vhs /tmp/probe.tape || echo "vhs exited $?"
          ls -la /tmp/probe.gif || echo "no /tmp/probe.gif"
        env:
          CI: ''
          COLORTERM: truecolor
        continue-on-error: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TELEPROMPT_REQUIRE_FFMPEG: "1"
          TELEPROMPT_REQUIRE_CAPTURE: "1"
          # Charm's termenv drops ANSI when CI is set, and `vhs` records a
          # terminal — a recording with no colour in it is not the one the
          # author wrote.
          CI: ''
          COLORTERM: truecolor

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
