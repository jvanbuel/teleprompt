name: Linux app

# The app and what it talks to: the prompter's API and the crates behind it.
on:
  push:
    paths:
      - apps/linux/**
      - apps/fixtures/**
      - docs/api/**
      - crates/teleprompt-cli/src/cmd/prompt*
      - crates/teleprompt-prompter/**
      - crates/teleprompt-listen/**
      - crates/teleprompt-listen-sherpa/**
      - .github/workflows/linux-app.yml
  pull_request:
    paths:
      - apps/linux/**
      - apps/fixtures/**
      - docs/api/**
      - crates/teleprompt-cli/src/cmd/prompt*
      - crates/teleprompt-prompter/**
      - crates/teleprompt-listen/**
      - crates/teleprompt-listen-sherpa/**
      - .github/workflows/linux-app.yml

jobs:
  app:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MODEL: sherpa-onnx-streaming-zipformer-en-2023-06-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/linux
      - name: GTK, GStreamer, and a display to run the app on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libgtk-4-media-gstreamer xvfb xdotool imagemagick ffmpeg
      # The server the app launches, with the recognizer.
      - run: cargo build -p teleprompt-cli --features listen
      - uses: actions/cache@v6
        with:
          path: model
          key: ${{ env.MODEL }}
      - name: Speech model
        run: |
          if [ ! -d "model/$MODEL" ]; then
            mkdir -p model
            curl -sSfL "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$MODEL.tar.bz2" | tar xj -C model
          fi
      - name: Check, build and test the app
        working-directory: apps/linux
        env:
          TELEPROMPT_BIN: ${{ github.workspace }}/target/debug/teleprompt
          TELEPROMPT_MODEL: ${{ github.workspace }}/model/${{ env.MODEL }}
          # Turns the end-to-end test's skip into a failure.
          TELEPROMPT_REQUIRE_E2E: "1"
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          UI_SHOTS=${{ runner.temp }}/shots tests/ui.sh
          UI_SHOTS=${{ runner.temp }}/shots/session tests/session.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-app-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
