name: Linux app

# The prompter page, in a browser and in the app around it, and the server
# and crates behind it.
on:
  push:
    branches: [main]
    paths:
      - apps/linux/**
      - apps/fixtures/**
      - docs/api/**
      - crates/teleprompt-serve/**
      - crates/teleprompt-project/src/dub/**
      - crates/teleprompt-setup/**
      - crates/teleprompt-cli/tests/page/**
      - crates/teleprompt-core/**
      - crates/teleprompt-script/**
      - crates/teleprompt-schedule/**
      - crates/teleprompt-listen/**
      - .github/workflows/linux-app.yml
  pull_request:
    paths:
      - apps/linux/**
      - apps/fixtures/**
      - docs/api/**
      - crates/teleprompt-serve/**
      - crates/teleprompt-project/src/dub/**
      - crates/teleprompt-setup/**
      - crates/teleprompt-cli/tests/page/**
      - crates/teleprompt-core/**
      - crates/teleprompt-script/**
      - crates/teleprompt-schedule/**
      - crates/teleprompt-listen/**
      - .github/workflows/linux-app.yml

# A newer push supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MODEL: sherpa-onnx-streaming-zipformer-en-2023-06-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/linux
      - name: GTK, WebKit, and a display to run the app on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            xvfb xdotool imagemagick ffmpeg asciinema
          # WebKit's sandbox (bubblewrap) needs unprivileged user namespaces,
          # which Ubuntu 24.04's AppArmor denies by default; without them the
          # first web page aborts the app.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # sherpa-onnx-sys unpacks its native library into
      # target/sherpa-onnx-prebuilt, and trusts that directory if it
      # exists. The Rust cache restores it without the library in it, so
      # remove it and rerun the build script to download it again.
      - run: rm -rf target/sherpa-onnx-prebuilt && cargo clean -p sherpa-onnx-sys
      # The server the app launches, with the recognizer.
      - run: cargo build -p teleprompt-cli --features listen
      - uses: actions/cache@v6
        with:
          path: model
          key: ${{ env.MODEL }}
      - name: Speech model
        run: |
          if [ ! -d "model/$MODEL" ]; then
            mkdir -p model
            curl -sSfL "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$MODEL.tar.bz2" | tar xj -C model
          fi
      # The prompter itself: the page, driven in Chrome against the server,
      # with a recorded reading as the microphone.
      - name: The page
        working-directory: crates/teleprompt-cli/tests/page
        env:
          TELEPROMPT_BIN: ${{ github.workspace }}/target/debug/teleprompt
          TELEPROMPT_MODEL: ${{ github.workspace }}/model/${{ env.MODEL }}
        run: |
          npm ci
          TELEPROMPT_CHROMIUM=$(command -v google-chrome) UI_SHOTS=${{ runner.temp }}/shots/page node prompter.mjs
      - name: Check, build and test the app
        working-directory: apps/linux
        env:
          TELEPROMPT_BIN: ${{ github.workspace }}/target/debug/teleprompt
          TELEPROMPT_MODEL: ${{ github.workspace }}/model/${{ env.MODEL }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          UI_SHOTS=${{ runner.temp }}/shots tests/ui.sh
          UI_SHOTS=${{ runner.temp }}/shots/session tests/session.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-app-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
