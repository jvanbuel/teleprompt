name: macOS app

# The app around the prompter page: launching the server.
on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - apps/fixtures/**
      - docs/api/**
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - apps/macos/**
      - apps/fixtures/**
      - docs/api/**
      - .github/workflows/macos.yml

# A newer push supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the app
        working-directory: apps/macos
        run: |
          swift build
          swift test
      - name: Bundle
        working-directory: apps/macos
        run: ./bundle.sh
