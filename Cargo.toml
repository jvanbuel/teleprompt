[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# 1.89 is the floor the dependency graph sets, not a feature we reach for:
# `serde-saphyr`, which reads YAML, needs 1.89, `home` (through etcetera)
# 1.88, the `icu_*` crates (through `url`) 1.86, and clap, blake3 and
# indexmap use edition 2024 (1.85). Holding an
# older floor would mean pinning transitive crates in Cargo.lock and
# re-pinning them after every update. Our own code uses nothing newer than
# `Option::is_some_and` (1.70).
rust-version = "1.89"
license = "MIT"

# Lints are configured once here and inherited by every crate via
# `[lints] workspace = true`, so a rule cannot hold in one crate and lapse in
# the next. Correctness is denied rather than warned: those lints fire on code
# that is wrong, not merely unfashionable.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# Size limits, so a function cannot quietly grow back past what a reader
# can hold: 100 lines (clippy.toml) and seven arguments.
too_many_lines = "deny"
too_many_arguments = "deny"
# A builder method that takes `self` and gives back `Self` does nothing if
# its result is dropped: `plan.fps(30);` compiles and changes nothing.
return_self_not_must_use = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "warn"

# Release binaries: link-time optimization across the workspace's crates, one
# codegen unit, and no symbols. Unwinding stays: panics are caught at task
# boundaries (a render task, a request), and aborting would end the process.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
insta = { version = "1", features = ["json"] }
pulldown-cmark = { version = "0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
