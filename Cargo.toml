[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# 1.85 is the floor the dependency graph sets, not a feature we reach for:
# clap, blake3 and indexmap all moved to edition 2024, which Cargo cannot even
# parse before 1.85. Holding 1.75 would mean pinning ten transitive crates to
# pre-2024 releases and re-pinning them after every update. Our own code uses
# nothing newer than `Option::is_some_and` (1.70).
rust-version = "1.85"
license = "MIT"

# Lints are configured once here and inherited by every crate via
# `[lints] workspace = true`, so a rule cannot hold in one crate and lapse in
# the next. Correctness is denied rather than warned: those lints fire on code
# that is wrong, not merely unfashionable.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "warn"

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json"] }
pulldown-cmark = { version = "0.11", default-features = false }
# `idna_adapter` (a transitive dependency, pulled in via `url`) is pinned to
# 1.2.0 in Cargo.lock, deliberately. Later versions pull in the `icu_*`
# crates, which require rustc 1.86+ — above the workspace's 1.85 floor. That
# pin lives only in the lock file; nothing in any manifest enforces it, so a
# broad `cargo update` (run by a human, or by a tool that doesn't respect the
# msrv job) can bump it straight past what CI tests. The msrv job runs
# `cargo check --workspace --locked`, so a re-bumped lock fails loudly on the
# offending PR — check that job before committing a regenerated lock.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
